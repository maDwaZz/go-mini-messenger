syntax = "proto3";

package users.v1;

import "google/protobuf/timestamp.proto";

option go_package = "proto/api/users/v1;usersv1";

message UserProfile {
    string id = 1;
    string user_id = 2;
    string nickname = 3;
    optional string bio = 4;
    optional string avatar_url = 5;
    google.protobuf.Timestamp created_at = 6;
}

message CreateProfileRequest {
    string user_id = 1;
    string nickname = 2;
    optional string bio = 3;
    optional string avatar_url = 4;
}

message UpdateProfileRequest {
    string user_id = 1;
    optional string nickname = 2;
    optional string bio = 3;
    optional string avatar_url = 4;
}

message GetProfileByIDRequest {
    string id = 1;
}

message GetProfileByNicknameRequest {
    string nickname = 1;
}

message SearchByNicknameRequest {
    string query = 1;
    uint32 limit = 2;
}

message SearchByNicknameResponse {
    repeated UserProfile results = 1;
}