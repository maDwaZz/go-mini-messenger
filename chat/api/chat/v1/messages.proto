syntax = "proto3";

package chat.v1;

import "google/protobuf/timestamp.proto";

option go_package = "proto/api/chat/v1;chatv1";

message Chat {
    string id = 1;
    string title = 2;
    repeated string member_ids = 3;
    google.protobuf.Timestamp created_at = 4;
}

message Message {
    string id = 1;
    string chat_id = 2;
    string sender_id = 3;
    string text = 4;
    google.protobuf.Timestamp created_at = 5;
}

message CreateDirectChatRequest {
    string participant_id = 1;
}

message CreateDirectChatResponse {
    string chat_id = 1;
}

message GetChatRequest {
    string chat_id = 1;
}

message GetChatResponse {
    Chat chat = 1;
}

message ListUserChatsRequest {
    string user_id = 1;
}

message ListUserChatsResponse {
    repeated Chat chats = 1;
}

message ListChatMembersRequest {
    string chat_id = 1;
}

message ListChatMembersResponse {
    repeated string user_ids = 1;
}

message SendMessageRequest {
    string chat_id = 1;
    string text = 2;
}

message SendMessageResponse {
    Message message = 1;
}

message ListMessagesRequest {
    string chat_id = 1;
    uint32 limit = 2;
    optional string cursor = 3;
}

message ListMessagesResponse {
    repeated Message messages = 1;
    optional string next_cursor = 2;
}

message StreamMessagesRequest {
    string chat_id = 1;
    optional uint64 since_unix_ms = 2;
}